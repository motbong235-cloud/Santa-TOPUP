<!doctype html>
<html lang="km">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SANTA TOPUP — Admin</title>
<!--
DESIGN — SANTA TOPUP Admin (Gift Ledger, matches storefront)
Same warm kraft-paper/pine-ink/wax-seal tokens as the Santa TOPUP storefront,
re-purposed for a data-dense back office: the nav reads like a gift ledger's
tab index, tables like ruled ledger pages, status badges like small wax-seal
tags. Fraunces for headings instead of Bebas Neue, cranberry red instead of
PVH's stamp red — same bones as the receipt-shop admin, warmer materials.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Archivo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF2E3;
  --paper:#FBF2E3; --paper-2:#F3E4C8; --panel:#FFFDF8; --panel-2:#FFFDF8; --panel-3:#F0E0BE;
  --line:#E8D9BA; --line-strong:#D4BD8E;
  --gold:#A31621; --gold-soft:#A31621; --gold-dim:#7a1018;
  --teal:#1E5AA8; --red:#A31621; --green:#2F6B4F;
  --text:#1F3A2E; --text-dim:#6B7C6F;
  --radius:4px;
  --shadow: 3px 3px 0 var(--line-strong);
}
*{box-sizing:border-box;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:0;}
body{
  margin:0; background:var(--bg);
  background-image:
    repeating-linear-gradient(180deg, transparent 0 63px, rgba(31,58,46,.035) 63px 64px);
  color:var(--text); font-family:'Archivo','Kantumruy Pro',sans-serif; font-size:16px;
}
h1,h2,h3,.khmer{font-family:'Fraunces','Kantumruy Pro',sans-serif; letter-spacing:.2px; font-weight:600;}
.mono{font-family:'Space Mono',monospace;}
a{color:inherit;}

/* ---- Login gate: ticket-perforated card, matches storefront ---- */
#gate{
  height:100vh; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:16px; padding:20px;
}
#gate .card{
  background:var(--panel); position:relative;
  border:1.5px solid var(--text); border-radius:var(--radius);
  padding:44px 36px 40px; width:100%; max-width:340px; text-align:center; box-shadow:var(--shadow);
}
#gate .card::before{
  content:""; position:absolute; top:0; left:16px; right:16px; height:0;
  border-top:2px dashed var(--line-strong);
}
#gate .card::after{
  content:""; position:absolute; top:-8px; left:0; right:0; height:16px;
  background:
    radial-gradient(circle at 20px 0, transparent 8px, var(--paper) 8.5px) top/40px 16px repeat-x,
    var(--panel);
  -webkit-mask: radial-gradient(circle at 20px 8px, transparent 8px, #000 8.5px) top/40px 16px repeat-x;
  mask: radial-gradient(circle at 20px 8px, transparent 8px, #000 8.5px) top/40px 16px repeat-x;
  border-radius:var(--radius) var(--radius) 0 0;
}
#gate .logo-badge{
  width:56px; height:56px; border-radius:50%; margin:0 auto 16px; display:flex; align-items:center;
  justify-content:center; font-size:26px; background:var(--gold); color:#fff;
  border:2px solid var(--text); transform:rotate(-6deg); position:relative; z-index:1;
  box-shadow:2px 2px 0 var(--text);
}
#gate .brand{color:var(--text); font-size:28px; margin-bottom:4px; letter-spacing:1px; position:relative; z-index:1;}
#gate p{color:var(--text-dim); margin:0 0 22px; font-size:12px; text-transform:uppercase; letter-spacing:1.5px; font-weight:700; position:relative; z-index:1;}
#gate input{
  width:100%; padding:13px 14px; border-radius:3px; border:1.5px solid var(--text);
  background:var(--paper); color:var(--text); font-size:15px; margin-bottom:14px; transition:border-color .15s;
  font-family:'Space Mono',monospace;
}
#gate input:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 2px rgba(30,90,168,.15);}
#gate button, .btn{
  width:100%; padding:13px; border-radius:3px; border:1.5px solid var(--text);
  background:var(--teal); color:#fff; font-weight:700; font-size:15px;
  cursor:pointer; letter-spacing:.3px; transition:transform .12s, box-shadow .12s;
  box-shadow:2px 2px 0 var(--text);
}
#gate button:hover, .btn:hover{transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--text);}
#gate button:active, .btn:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--text);}
#gate .err{color:var(--red); font-size:13px; min-height:18px; font-weight:600;}

/* ---- App shell ---- */
#app{display:none; height:100vh;}
.shell{display:flex; height:100%; position:relative;}
.overlay{
  display:none; position:fixed; inset:0; background:rgba(28,27,25,.5); z-index:15;
}
.overlay.show{display:block;}

/* ---- Nav: folder-tab index ---- */
nav{
  width:222px; background:var(--paper-2); border-right:1.5px solid var(--text);
  padding:22px 0; flex-shrink:0; display:flex; flex-direction:column; z-index:20;
}
nav .logo{padding:0 20px 20px; color:var(--text); font-size:21px; letter-spacing:1px; border-bottom:2px dashed var(--line-strong); margin-bottom:14px; display:flex; align-items:center; gap:10px;}
nav .logo .badge{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#fff;border:1.5px solid var(--text);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0; transform:rotate(-6deg); box-shadow:1.5px 1.5px 0 var(--text);}
nav .logo small{display:block; color:var(--text-dim); font-size:9.5px; font-family:'Archivo'; font-weight:700; letter-spacing:.14em; margin-top:1px;}
nav button{
  position:relative; text-align:left; background:none; border:none; color:var(--text-dim);
  margin:0 10px 4px; padding:12px 14px; font-family:'Archivo'; font-size:14px; font-weight:600;
  cursor:pointer; display:flex; align-items:center; gap:10px; border-radius:3px 10px 10px 3px;
  transition:background .15s, color .15s, transform .1s;
}
nav button:hover{color:var(--text); background:rgba(255,253,246,.6);}
nav button.active{
  color:var(--text); background:var(--panel); font-weight:700;
  box-shadow:-3px 0 0 var(--gold), 2px 2px 0 var(--line-strong);
}
nav .spacer{flex:1;}
nav .logout{color:var(--red); font-size:13px; opacity:.85; font-weight:700; margin:8px 10px 0;}
.topbar{display:none;}
main{flex:1; overflow-y:auto; padding:30px 36px;}
main h1{font-size:27px; margin:0 0 4px; color:var(--text); display:flex; align-items:center; gap:10px; letter-spacing:.6px;}
main .sub{color:var(--text-dim); font-size:13.5px; margin:0 0 20px;}

/* ---- Stat chips: small stamped totals ---- */
.stats-row{display:flex; gap:14px; margin-bottom:22px; flex-wrap:wrap;}
.stat-chip{
  position:relative; background:var(--panel); border:1.5px solid var(--text);
  border-radius:var(--radius); padding:12px 18px; min-width:112px; box-shadow:var(--shadow);
}
.stat-chip .n{font-size:23px; font-weight:700; color:var(--gold); font-family:'Space Mono';}
.stat-chip .l{font-size:10.5px; color:var(--text-dim); margin-top:2px; text-transform:uppercase; letter-spacing:.6px; font-weight:700;}

.toolbar{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center;}
.toolbar select, .toolbar input{
  padding:10px 12px; border-radius:3px; border:1.5px solid var(--text);
  background:var(--panel); color:var(--text); font-family:'Archivo'; font-size:14px;
}
.toolbar .btn{width:auto; padding:10px 20px; font-size:14px;}
.btn.ghost{background:var(--panel); border:1.5px solid var(--gold-dim); color:var(--gold); box-shadow:2px 2px 0 var(--line-strong);}
.btn.ghost:hover{box-shadow:3px 3px 0 var(--line-strong);}
.btn.small{width:auto; padding:7px 14px; font-size:13px;}
.btn.danger{background:var(--red); color:#fff; border-color:var(--text);}

/* ---- Data panel: ledger binder-tab signature ---- */
.card-panel{
  position:relative; margin-top:18px;
  background:var(--panel); border:1.5px solid var(--text);
  border-radius:0 var(--radius) var(--radius) var(--radius); overflow:visible; box-shadow:var(--shadow);
}
.card-panel::before{
  content:"LEDGER"; position:absolute; top:-22px; left:-1.5px; font-family:'Space Mono',monospace;
  font-size:9px; font-weight:700; letter-spacing:.14em; color:var(--paper);
  background:var(--text); padding:5px 10px 4px; border-radius:3px 6px 0 0;
}
.card-panel > *{overflow:hidden; border-radius:inherit;}
table{width:100%; border-collapse:collapse;}
th, td{padding:12px 14px; text-align:left; border-bottom:1px dashed var(--line-strong); font-size:14px; vertical-align:middle;}
th{color:var(--text-dim); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.08em; background:var(--paper-2);}
tr:last-child td{border-bottom:none;}
tbody tr:nth-child(even) td{background:rgba(211,203,180,.14);}
tr:hover td{background:rgba(195,57,43,.05);}
td.actions{white-space:nowrap; width:1%;}
td input{
  width:100%; padding:7px 9px; border-radius:3px; border:1.5px solid var(--line-strong);
  background:var(--paper); color:var(--text); font-family:'Archivo'; font-size:14px;
}
td input:focus{outline:none; border-color:var(--teal);}

/* ---- Status badges: dotted ink stamps ---- */
.badge{padding:3px 11px 3px 9px; border-radius:20px; font-size:11px; font-weight:700; display:inline-flex; align-items:center; gap:5px; letter-spacing:.02em; border:1.5px solid currentColor;}
.badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0;}
.badge.pending{background:#fff; color:#8a6a2c;}
.badge.processing{background:#fff; color:var(--teal);}
.badge.delivered{background:#fff; color:var(--green);}
.badge.failed{background:#fff; color:var(--red);}
.badge.manual{background:#fff; color:#7a5fb3;}
.badge.paid{background:#fff; color:var(--green);}
.badge.expired{background:#fff; color:var(--text-dim);}
.badge.cancelled{background:#fff; color:var(--text-dim);}

.new-row{background:rgba(195,57,43,.06) !important;}
.empty{color:var(--text-dim); text-align:center; padding:48px 12px; font-size:14px;}
.empty .ic{font-size:30px; display:block; margin-bottom:10px; opacity:.7;}
.skeleton{padding:20px;}
.skeleton .bar{height:14px; border-radius:3px; background:linear-gradient(90deg, var(--paper-2), var(--panel-3), var(--paper-2)); background-size:200% 100%; animation:shimmer 1.2s infinite; margin-bottom:10px; border:1px dashed var(--line-strong);}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

.toast{
  position:fixed; bottom:22px; right:22px; left:auto; background:var(--text); border:1.5px solid var(--text);
  padding:13px 20px; border-radius:3px; font-size:14px; opacity:0; transform:translateY(8px); color:var(--paper);
  transition:all .25s; pointer-events:none; box-shadow:3px 3px 0 var(--line-strong); max-width:calc(100vw - 44px); z-index:50;
  font-weight:600;
}
.toast.show{opacity:1; transform:translateY(0);}
.toast.err{border-color:var(--red); background:var(--red); color:#fff;}
.toast.ok{border-color:var(--green); background:var(--green); color:#fff;}

.settings-form{max-width:560px; display:flex; flex-direction:column; gap:16px;}
.settings-form label{font-size:12px; color:var(--text-dim); font-weight:700; display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px;}
.settings-form input, .settings-form textarea{
  width:100%; padding:11px 13px; border-radius:3px; border:1.5px solid var(--text);
  background:var(--panel); color:var(--text); font-family:'Archivo'; font-size:15px;
}
.settings-form input:focus, .settings-form textarea:focus{outline:none; border-color:var(--teal);}
.settings-form textarea{resize:vertical; min-height:60px;}

/* ---- Image upload widget (used for games/products/banners/logo) ---- */
.img-field{display:flex; align-items:center; gap:8px;}
.img-field .thumb{
  width:38px; height:38px; border-radius:3px; object-fit:cover; background:var(--paper-2);
  border:1.5px solid var(--text); flex-shrink:0;
}
.img-field .thumb.empty-thumb{display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--text-dim);}
.img-field input[type=text]{flex:1; min-width:90px;}
.img-field .upload-btn{
  flex-shrink:0; width:34px; height:34px; border-radius:3px; border:1.5px solid var(--gold-dim);
  background:var(--paper); color:var(--gold); display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:15px; transition:background .15s;
}
.img-field .upload-btn:hover{background:var(--paper-2);}
.img-field .upload-btn.loading{opacity:.5; pointer-events:none;}
.img-field input[type=file]{display:none;}
.settings-form .img-field{max-width:340px;}
.settings-form .img-field .thumb{width:50px; height:50px; border-radius:50%;}

/* ---- Mobile responsive ---- */
@media (max-width: 900px){
  .shell{display:block;}
  nav{
    position:fixed; top:0; left:0; bottom:0; transform:translateX(-100%);
    transition:transform .2s ease; box-shadow:var(--shadow);
  }
  nav.open{transform:translateX(0);}
  .topbar{
    display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--panel);
    border-bottom:2px dashed var(--line-strong); position:sticky; top:0; z-index:10;
  }
  .topbar .hamburger{
    width:38px; height:38px; border-radius:3px; border:1.5px solid var(--text); background:var(--paper);
    color:var(--text); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .topbar .title{color:var(--text); font-size:19px; letter-spacing:.6px;}
  main{padding:22px 16px 90px;}
  main h1{font-size:22px;}
  .card-panel{margin-top:24px;}
  table, thead, tbody, th, tr, td{display:block;}
  thead{display:none;}
  .card-panel table tr{
    border-bottom:1.5px dashed var(--line-strong); padding:12px 14px; display:block;
  }
  tbody tr:nth-child(even) td{background:none;}
  .card-panel table tr:nth-child(even){background:rgba(211,203,180,.14);}
  .card-panel table tr:last-child{border-bottom:none;}
  td{border:none; padding:6px 0; background:none !important;}
  td:before{
    content:attr(data-label); display:block; font-size:10px; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; font-weight:700;
  }
  td.actions{width:auto; display:flex; gap:8px; padding-top:8px;}
  .toast{left:16px; right:16px; bottom:16px; max-width:none;}
}
@media (min-width: 901px){
  .topbar{display:none;}
}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo-badge">🎁</div>
    <div class="brand khmer">SANTA TOPUP</div>
    <p>Admin Panel</p>
    <input id="pwInput" type="password" placeholder="Admin password" />
    <button onclick="login()">ចូល / Login</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="app">
  <div class="shell">
    <div class="overlay" id="navOverlay" onclick="closeNav()"></div>
    <nav id="sideNav">
      <div class="logo khmer"><span class="badge">🎁</span><span>SANTA TOPUP<small>ADMIN PANEL</small></span></div>
      <button data-tab="games" class="active" onclick="switchTab('games')">🎮 Games</button>
      <button data-tab="products" onclick="switchTab('products')">💠 Products</button>
      <button data-tab="banners" onclick="switchTab('banners')">🖼️ Banners</button>
      <button data-tab="khmertopup" onclick="switchTab('khmertopup')">🔌 Khmer TopUp</button>
      <button data-tab="transactions" onclick="switchTab('transactions')">🧾 Transactions</button>
      <button data-tab="security" onclick="switchTab('security')">🛡️ Security</button>
      <button data-tab="settings" onclick="switchTab('settings')">⚙️ Settings</button>
      <div class="spacer"></div>
      <button class="logout" onclick="logout()">↩ Logout</button>
    </nav>
    <div style="flex:1; display:flex; flex-direction:column; min-width:0;">
      <div class="topbar">
        <div class="hamburger" onclick="openNav()">☰</div>
        <div class="title khmer">SANTA TOPUP</div>
      </div>
      <main id="main"></main>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = ""; // same origin — calls go to /api/admin-*
function getToken(){ return localStorage.getItem("pvh_admin_token") || ""; }
function setToken(t){ localStorage.setItem("pvh_admin_token", t); }
function clearToken(){ localStorage.removeItem("pvh_admin_token"); }

function openNav(){ document.getElementById("sideNav").classList.add("open"); document.getElementById("navOverlay").classList.add("show"); }
function closeNav(){ document.getElementById("sideNav").classList.remove("open"); document.getElementById("navOverlay").classList.remove("show"); }

async function api(path, opts = {}) {
  const res = await fetch(`/api/${path}`, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      "x-admin-token": getToken(),
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401) { logout(); throw new Error("Session expired"); }
  const data = await res.json();
  if (!data.success && res.status >= 400) throw new Error(data.error || "Request failed");
  return data;
}

// Multipart upload — does NOT set Content-Type manually (browser sets the boundary)
async function uploadFile(file) {
  const form = new FormData();
  form.append("file", file);
  const res = await fetch("/api/admin-upload", {
    method: "POST",
    headers: { "x-admin-token": getToken() },
    body: form,
  });
  const data = await res.json();
  if (!data.success) throw new Error(data.error || "Upload failed");
  return data.url;
}

function toast(msg, kind = "ok") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = `toast show ${kind}`;
  setTimeout(() => (el.className = "toast"), 2500);
}

async function login() {
  const pw = document.getElementById("pwInput").value.trim();
  if (!pw) return;
  setToken(pw);
  try {
    await api("admin-games"); // any admin GET doubles as a password check
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    switchTab("games");
  } catch (err) {
    clearToken();
    document.getElementById("gateErr").textContent = "ពាក្យសម្ងាត់មិនត្រឹមត្រូវ / Wrong password";
  }
}
function logout() {
  clearToken();
  document.getElementById("app").style.display = "none";
  document.getElementById("gate").style.display = "flex";
  document.getElementById("pwInput").value = "";
}

let currentTab = "games";
function switchTab(tab) {
  currentTab = tab;
  closeNav();
  document.querySelectorAll("nav button[data-tab]").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  ({ games: renderGames, products: renderProducts, banners: renderBanners, khmertopup: renderKhmerTopUp, transactions: renderTransactions, security: renderSecurity, settings: renderSettings })[tab]();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function skeletonRows(n = 3) {
  return `<div class="skeleton">${Array(n).fill('<div class="bar"></div>').join("")}</div>`;
}

function emptyState(icon, text) {
  return `<div class="empty"><span class="ic">${icon}</span>${text}</div>`;
}

// ---------- Reusable image upload field ----------
// Renders a thumbnail + text input (still editable/pasteable) + an upload button.
// `onChangeAttr` is an inline JS string invoked after the URL changes (e.g. to refresh a preview elsewhere).
let imgFieldSeq = 0;
function imageField(fieldName, value, placeholder = "https://...") {
  const uid = `imgf_${++imgFieldSeq}`;
  const hasVal = value && value.trim();
  return `
    <div class="img-field" id="${uid}">
      ${hasVal
        ? `<img class="thumb" src="${esc(value)}" onerror="this.outerHTML='<div class=\\'thumb empty-thumb\\'>🖼️</div>'">`
        : `<div class="thumb empty-thumb">🖼️</div>`}
      <input type="text" value="${esc(value || "")}" data-f="${fieldName}" placeholder="${placeholder}"
             oninput="refreshThumb('${uid}', this.value)">
      <label class="upload-btn" title="Upload image">
        📤<input type="file" accept="image/*" onchange="handleImgUpload(event, '${uid}')">
      </label>
    </div>`;
}
function refreshThumb(uid, url) {
  const wrap = document.getElementById(uid);
  if (!wrap) return;
  const old = wrap.querySelector(".thumb");
  if (url && url.trim()) {
    const img = new Image();
    img.className = "thumb";
    img.src = url;
    img.onerror = () => { img.outerHTML = '<div class="thumb empty-thumb">🖼️</div>'; };
    old.replaceWith(img);
  } else {
    old.outerHTML = '<div class="thumb empty-thumb">🖼️</div>';
  }
}
async function handleImgUpload(event, uid) {
  const file = event.target.files[0];
  if (!file) return;
  const wrap = document.getElementById(uid);
  const btn = wrap.querySelector(".upload-btn");
  const input = wrap.querySelector("input[type=text]");
  btn.classList.add("loading");
  try {
    const url = await uploadFile(file);
    input.value = url;
    refreshThumb(uid, url);
    toast("បានបញ្ចូលរូបភាព");
  } catch (err) {
    toast(err.message, "err");
  } finally {
    btn.classList.remove("loading");
    event.target.value = "";
  }
}

function readRow(tr) {
  const out = {};
  tr.querySelectorAll("input[data-f], select[data-f]").forEach(i => {
    out[i.dataset.f] = i.type === "checkbox" ? i.checked : i.value;
  });
  return out;
}
function sectionSelect(value) {
  const v = value === "recommend" ? "recommend" : "normal";
  return `<select data-f="section">
    <option value="normal" ${v === "normal" ? "selected" : ""}>Normal</option>

async function loadKhmerTopUpCatalogue(force = false) {

function copyToClipboard(text, label) {

// Opens a small picker over the Khmer TopUp catalogue; onPick(game) is called

async function pickKhmerTopUpGame(onPick) {
  const modal = document.createElement("div");
  modal.setAttribute("style", "position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;");
  modal.innerHTML = `<div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden">

  </div>`;
  modal.setAttribute("data-kt-modal", "1");
  document.body.appendChild(modal);
  modal.addEventListener("click", e => { if (e.target === modal) modal.remove(); });

  let games = [];
  try { games = await loadKhmerTopUpCatalogue(); }
  catch (err) { document.getElementById("ktListWrap").innerHTML = emptyState("⚠️", esc(err.message)); return; }

  function render(filter) {

    document.getElementById("ktListWrap").innerHTML = shown.length
      ? shown.map(g => `<div style="padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px" onmouseover="this.style.background='var(--panel-2)'" onmouseout="this.style.background=''" data-slug="${esc(g.slug)}">

    document.querySelectorAll("#ktListWrap [data-slug]").forEach(row => {
      row.addEventListener("click", () => {
        const g = games.find(x => x.slug === row.dataset.slug);
        modal.remove();
        onPick(g);
      });
    });
  }
  render("");
  document.getElementById("ktSearchInput").addEventListener("input", e => render(e.target.value));
}

let productsGamesCache = [];
function marginBadge(cost, price) {
  const c = parseFloat(cost), p = parseFloat(price);
  if (!isFinite(c) || !isFinite(p) || c <= 0) return `<span style="color:var(--text-dim);font-size:12px">—</span>`;
  const profit = p - c;
  const pct = (profit / c) * 100;
  const color = profit <= 0 ? "var(--red)" : pct < 10 ? "var(--gold-soft)" : "var(--green)";
  const sign = profit > 0 ? "+" : "";
  return `<span style="color:${color};font-weight:700;font-size:13px">${sign}$${profit.toFixed(2)}</span>
    <div style="color:${color};font-size:11px">${sign}${pct.toFixed(0)}%</div>`;
}
function updateMarginCell(tr) {
  const cost = tr.querySelector('input[data-f="cost_usd"]').value;
  const price = tr.querySelector('input[data-f="price"]').value;
  tr.querySelector(".margin-cell").innerHTML = marginBadge(cost, price);
}
async function applyMarkupToAll() {
  const pct = parseFloat(document.getElementById("markupPct").value);
  if (!isFinite(pct)) { toast("សូមវាយ markup % ជាលេខ", "err"); return; }
  const rows = document.querySelectorAll("#productsTableWrap tbody tr[data-id]");
  let updated = 0;
  for (const tr of rows) {
    const priceInput = tr.querySelector('input[data-f="price"]');
    const costInput = tr.querySelector('input[data-f="cost_usd"]');
    const cost = parseFloat(costInput.value);
    if (isFinite(cost) && cost > 0 && (!priceInput.value || parseFloat(priceInput.value) <= 0)) {
      const newPrice = (cost * (1 + pct / 100)).toFixed(2);
      priceInput.value = newPrice;
      updateMarginCell(tr);
      try {
        await api("admin-products", { method: "PUT", body: JSON.stringify({ id: tr.dataset.id, price: newPrice }) });
        updated++;
      } catch (err) { toast(err.message, "err"); }
    }
  }
  toast(updated ? `បានកំណត់តម្លៃ ${updated} product (markup ${pct}%)` : "គ្មាន product ណាទទេត្រូវបំពេញទេ (Price ត្រូវទទេ ហើយ Cost ត្រូវបំពេញ)");
}

function browsePackageForRow(btn) {
  const tr = btn.closest("tr");
  const gameCode = tr.querySelector('input[data-f="game_code"]').value.trim();
  const game = productsGamesCache.find(g => g.code === gameCode);

    return;

  pickKhmerTopUpPackage(game.khmertopup_slug, pkg => {
    tr.querySelector('input[data-f="provider_package"]').value = pkg.package_id;

    if (!nameInput.value) nameInput.value = pkg.name;
    toast(`បានជ្រើស ${pkg.name} (package_id: ${pkg.package_id})`);
  });
}

      <tbody>${banners.map(b => `
        <tr data-id="${b.id}">
          <td data-label="Image">${imageField("image_url", b.image_url)}</td>
          <td data-label="Type">${bannerTypeSelect(b.type)}</td>
          <td data-label="Link"><input value="${esc(b.link || "")}" data-f="link" placeholder="https://... (optional)"></td>
          <td class="actions">
            <button class="btn small ghost" onclick="saveBanner(${b.id})">Save</button>
            <button class="btn small danger" onclick="deleteBanner(${b.id})">Delete</button>
          </td>
        </tr>`).join("")}
      </tbody></table>`;
  } catch (err) { wrap.innerHTML = emptyState("⚠️", esc(err.message)); }
}
function addBannerRow() {
  const wrap = document.getElementById("bannersTableWrap");
  let table = wrap.querySelector("tbody");
  if (!table) {
    // No banners yet — the wrap only has the empty-state message and no <table> to
    // attach a row to. Build the table shell first, then fall through to add the row.
    wrap.innerHTML = `<table><thead><tr><th>Image</th><th>Type</th><th>Link</th><th></th></tr></thead><tbody></tbody></table>`;
    table = wrap.querySelector("tbody");
  }
  const tr = document.createElement("tr");
  tr.className = "new-row";
  tr.innerHTML = `<td data-label="Image">${imageField("image_url", "")}</td>
    <td data-label="Type">${bannerTypeSelect("main_slider")}</td>
    <td data-label="Link"><input placeholder="https://... (optional)" data-f="link"></td>
    <td class="actions"><button class="btn small" onclick="createBanner(this)">Create</button></td>`;
  table.prepend(tr);
}
async function createBanner(btn) {
  const body = readRow(btn.closest("tr"));
  try { await api("admin-banners", { method: "POST", body: JSON.stringify(body) }); toast("បានបន្ថែម"); loadBanners(); }
  catch (err) { toast(err.message, "err"); }
}
async function saveBanner(id) {
  const body = { id, ...readRow(document.querySelector(`tr[data-id="${id}"]`)) };
  try { await api("admin-banners", { method: "PUT", body: JSON.stringify(body) }); toast("បានរក្សាទុក"); }
  catch (err) { toast(err.message, "err"); }
}
async function deleteBanner(id) {
  if (!confirm("លុប banner នេះ?")) return;
  try { await api(`admin-banners?id=${id}`, { method: "DELETE" }); toast("បានលុប"); loadBanners(); }
  catch (err) { toast(err.message, "err"); }
}

    wrap.innerHTML = `<table><thead><tr>

      </tr></thead><tbody>${transactions.map(t => `
        <tr>
          <td data-label="Trx ID" class="mono" title="${esc(t.reference || "")}">${esc(t.trx_id)}</td>

async function renderSecurity() {
  const main = document.getElementById("main");
  main.innerHTML = `<h1 class="khmer">🛡️ Security</h1><p class="sub">IP ដែលកំពុងត្រូវ ban ឬកំពុងប្រមូល strike — ទិន្នន័យនេះនៅក្នុង RAM ប៉ុណ្ណោះ ចាប់ផ្ដើមទទេរាល់ដង server restart/redeploy (មិនមែនប្រវត្តិអចិន្ត្រៃយ៍ទេ)</p>
    <div class="stats-row" id="secStats"></div>
    <div class="toolbar">
      <button class="btn" style="width:auto;padding:10px 20px" onclick="loadSecurityLog()">↻ Refresh</button>
    </div>
    <div class="card-panel" id="secTableWrap">${skeletonRows()}</div>`;
  await loadSecurityLog();
}
function fmtSecondsLeft(s) {
  if (s <= 0) return "-";
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.ceil(s / 60)}m`;
  return `${Math.ceil(s / 3600)}h`;
}
async function loadSecurityLog() {
  const wrap = document.getElementById("secTableWrap");
  try {
    const { rows, limiter_enabled } = await api("admin-security-log");
    if (limiter_enabled === false) {
      wrap.innerHTML = emptyState("⚠️", "Flask-Limiter មិនទាន់ដំឡើងលើ server ទេ — គ្មាន rate-limit ការពារសោះ");
      return;
    }
    const bannedNow = rows.filter(r => r.banned_now).length;
    document.getElementById("secStats").innerHTML = `
      <div class="stat-chip"><div class="n">${rows.length}</div><div class="l">IP មាន strike</div></div>
      <div class="stat-chip"><div class="n" style="color:var(--red)">${bannedNow}</div><div class="l">កំពុង Ban ឥឡូវនេះ</div></div>`;
    if (!rows.length) { wrap.innerHTML = emptyState("🛡️", "គ្មាន IP ណាមួយប្រព្រឹត្តខុសទេ តាំងពី server ចាប់ផ្តើមចុងក្រោយ"); return; }
    wrap.innerHTML = `<table><thead><tr>
        <th>IP</th><th>Strikes</th><th>Status</th><th>នៅសល់</th><th>ចុងក្រោយ</th>
      </tr></thead><tbody>${rows.map(r => `
        <tr class="${r.banned_now ? "new-row" : ""}">
          <td data-label="IP" class="mono">${esc(r.ip)}</td>
          <td data-label="Strikes" class="mono">${r.strikes}</td>
          <td data-label="Status"><span class="badge ${r.banned_now ? "failed" : "expired"}">${r.banned_now ? "BANNED" : "clear"}</span></td>
          <td data-label="នៅសល់" class="mono">${r.banned_now ? fmtSecondsLeft(r.banned_seconds_left) : "-"}</td>
          <td data-label="ចុងក្រោយ" class="mono" style="font-size:12px">${r.last_violation ? new Date(r.last_violation * 1000).toLocaleString() : ""}</td>
        </tr>`).join("")}
      </tbody></table>`;
  } catch (err) { wrap.innerHTML = emptyState("⚠️", esc(err.message)); }
}
